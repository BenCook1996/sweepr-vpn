name: "SWEEPR VPN — Weekly Full-System Security & Code Signing Audit"

on:
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vpn-weekly-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SWEEPR VPN Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Full-System Security & Authenticode Code-Signing Audit
        run: |
          node scripts/cloud-security-audit.mjs

      - name: Commit Security Audit Report
        run: |
          git config user.name "sweepr-security-bot"
          git config user.email "security@sweeprvpn.com"
          git add SECURITY_AUDIT_LOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(security): weekly cloud security & Authenticode verification report"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi
