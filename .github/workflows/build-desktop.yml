name: Build SWEEPR VPN Desktop (Windows, macOS, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            os_name: windows
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            os_name: macos
          - platform: ubuntu-22.04
            args: ''
            os_name: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf wireguard-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os_name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop-tauri/src-tauri -> target'

      - name: Install Tauri CLI dependencies
        working-directory: apps/desktop-tauri
        run: npm ci --no-audit || npm install --no-audit

      - name: Build Tauri application & installers
        working-directory: apps/desktop-tauri
        run: npx tauri build ${{ matrix.args }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sweepr-vpn-${{ matrix.os_name }}
          path: |
            apps/desktop-tauri/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop-tauri/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop-tauri/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop-tauri/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop-tauri/src-tauri/target/**/release/bundle/appimage/*.AppImage
