<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SWEEPR VPN — De-Cluttered App Prototype (Mockup B)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
<style>
  :root {
    --e400:#34d399; --e500:#10b981; --e600:#059669; --e700:#047857;
    --bg:#f4faf7; --rail:#eef6f2; --card:#ffffff; --line:#e2ece7;
    --ink:#0f172a; --muted:#64748b;
    --amberbg:#fef3c7; --amberline:#fde68a; --amberink:#92400e;
    --accent:#059669; --sel:#e6f7ef;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; user-select:none; }
  body {
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Inter,sans-serif;
    font-size:14px; color:var(--ink); background:#dcece5;
    display:grid; place-items:center; padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; cursor:pointer; border:0; background:none; color:inherit; }

  /* Floating Window Frame */
  .window {
    width:100%; max-width:960px; height:600px;
    background:var(--bg); border-radius:24px;
    box-shadow:0 30px 80px rgba(15,23,42,.18), 0 0 0 1px rgba(15,23,42,.06);
    display:grid; grid-template-columns:68px 1fr 360px;
    overflow:hidden; position:relative;
  }

  /* Slim 3-Icon Rail */
  .rail {
    background:var(--rail); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    gap:12px; padding:22px 0;
  }
  .rail-btn {
    width:44px; height:44px; border-radius:14px;
    display:grid; place-items:center; color:#64748b; transition:all .15s;
  }
  .rail-btn:hover { background:rgba(5,150,105,.08); color:var(--ink); }
  .rail-btn.on { background:#064e3b; color:#fff; box-shadow:0 6px 16px rgba(6,78,59,.25); }
  .rail .spacer { flex:1; }

  /* De-Cluttered Center Column (No Search Bar, No Filter Tabs, No Duplicate Quick Picks) */
  .main { padding:32px 34px; display:flex; flex-direction:column; justify-content:space-between; }
  h1.title { font-size:26px; font-weight:800; letter-spacing:-.5px; color:var(--ink); }
  .sub { font-size:13px; color:var(--muted); margin-top:2px; }

  .tv-pill {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--amberbg); border:1px solid var(--amberline);
    border-radius:14px; padding:11px 14px; margin:18px 0 14px;
    color:var(--amberink); font-weight:600; font-size:13.5px;
  }
  .tv-pill.safe {
    background:var(--sel); border-color:rgba(16,185,129,.3); color:#065f46;
  }
  .tv-btn {
    background:#064e3b; color:#fff; font-size:12px; font-weight:700;
    padding:6px 13px; border-radius:9px; transition:opacity .15s;
  }
  .tv-btn:hover { opacity:.9; }

  .loc-list { display:flex; flex-direction:column; gap:2px; }
  .loc-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border-radius:13px; transition:background .12s;
  }
  .loc-row:hover { background:rgba(5,150,105,.06); }
  .loc-row.on { background:var(--sel); font-weight:700; }
  .loc-left { display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:600; }
  .flag { width:26px; height:18px; border-radius:4px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,.08); display:block; }
  .ping { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ping::before { content:""; width:7px; height:7px; border-radius:50%; background:#34d399; }

  /* De-Cluttered Right Connection Panel */
  .panel {
    margin:14px 14px 14px 0; border-radius:22px;
    background:linear-gradient(165deg,#064e3b 0%,#043927 100%);
    color:#fff; padding:32px 28px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .rings {
    position:absolute; inset:50% auto auto 50%; width:320px; height:320px;
    transform:translate(-50%,-50%); border-radius:50%;
    border:1px solid rgba(167,243,208,.14);
    box-shadow:0 0 0 42px rgba(167,243,208,.05), 0 0 0 84px rgba(167,243,208,.03), 0 0 0 126px rgba(167,243,208,.015);
    pointer-events:none;
  }
  .panel.on .rings { animation:breathe 3.6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform:translate(-50%,-50%) scale(1); }
    50% { transform:translate(-50%,-50%) scale(1.05); }
  }
  .panel-title { font-size:28px; font-weight:800; line-height:1.18; letter-spacing:-.5px; position:relative; z-index:2; }
  .panel-meta { font-size:13px; color:#a7f3d0; margin-top:10px; position:relative; z-index:2; }
  .connect-pill {
    margin-top:26px; background:#fff; color:#064e3b;
    font-size:15px; font-weight:800; padding:13px 34px; border-radius:999px;
    box-shadow:0 10px 25px rgba(0,0,0,.2); position:relative; z-index:2;
    transition:transform .15s;
  }
  .connect-pill:hover { transform:translateY(-1px); }

  /* De-Cluttered Upgrade Modal (Only 3 Clean Plans + 1 Button; Key Input Collapsed) */
  .backdrop {
    position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(5px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
  }
  .backdrop.open { display:flex; }
  .sheet {
    width:100%; max-width:400px; background:#fff; border-radius:22px;
    padding:22px; box-shadow:0 25px 60px rgba(15,23,42,.28);
    display:flex; flex-direction:column; gap:10px;
  }
  .plan {
    border:1.5px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; text-align:left;
    transition:all .12s;
  }
  .plan.on { border:2px solid var(--e500); background:var(--sel); }
  .btn-go {
    width:100%; background:var(--e600); color:#fff; border-radius:999px;
    font-weight:800; font-size:14.5px; padding:13px; margin-top:4px;
  }

  @media (max-width: 820px) {
    body { padding:0; }
    .window { height:100vh; border-radius:0; grid-template-columns:1fr; grid-template-rows:auto 1fr auto; }
    .rail { flex-direction:row; justify-content:space-around; padding:10px; border-right:0; border-top:1px solid var(--line); order:3; }
    .rail .spacer { display:none; }
    .panel { order:1; margin:12px; padding:24px 18px; }
    .main { order:2; padding:16px 18px; overflow-y:auto; }
  }
</style>
</head>
<body>

  <!-- Tiny Bottom-Right Prototype Switcher -->
  <div style="position:fixed;bottom:14px;right:14px;z-index:120;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.08)">
    <button onclick="openModal(true)" style="color:#059669;font-weight:800">Preview Minimal £1.99 Sheet</button>
    <span style="color:#cbd5e1">|</span>
    <a href="/prototype-mockup-a.html" style="color:#334155;text-decoration:none">&larr; Hero (Mockup A)</a>
  </div>

  <div class="window">
    <!-- Left Rail (3 Icons Only) -->
    <nav class="rail" aria-label="Main navigation">
      <button class="rail-btn on" title="VPN"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></button>
      <button class="rail-btn" title="Wi-Fi &amp; TV" onclick="openModal(true)"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg></button>
      <div class="spacer"></div>
      <button class="rail-btn" title="Account" onclick="openModal(true)"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg></button>
    </nav>

    <!-- Center Column: Choose a Country (No Search Bar, No Filter Tabs, No Duplicate Quick Picks) -->
    <main class="main">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <h1 class="title">Select a Location</h1>
            <div class="sub">Choose a Country</div>
          </div>
        </div>

        <!-- Single Subtle Smart-TV Tracking Bar -->
        <div class="tv-pill" id="tvBar">
          <span>📺 Samsung TV tracking detected</span>
          <button class="tv-btn" id="tvBtn" onclick="blockTv()">Block</button>
        </div>

        <!-- Clean Country List -->
        <div class="loc-list" id="locList">
          <button class="loc-row on" onclick="pickNode('United Kingdom', 'London', '8 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="4"/><path d="M30,0V40 M0,20H60" stroke="#fff" stroke-width="12"/><path d="M30,0V40 M0,20H60" stroke="#C8102E" stroke-width="7"/></svg></span>
              <span>United Kingdom</span>
            </span>
            <span class="ping">8 ms</span>
          </button>

          <button class="loc-row" onclick="pickNode('Sweden', 'Stockholm', '19 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#006AA7"/><rect x="17" width="8" height="40" fill="#FECC02"/><rect y="16" width="60" height="8" fill="#FECC02"/></svg></span>
              <span>Sweden</span>
            </span>
            <span class="ping">19 ms</span>
          </button>

          <button class="loc-row" onclick="pickNode('Netherlands', 'Amsterdam', '14 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 40"><rect width="60" height="13.3" fill="#AE1C28"/><rect y="13.3" width="60" height="13.3" fill="#fff"/><rect y="26.6" width="60" height="13.4" fill="#21468B"/></svg></span>
              <span>Netherlands</span>
            </span>
            <span class="ping">14 ms</span>
          </button>

          <button class="loc-row" onclick="pickNode('Germany', 'Frankfurt', '16 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 39"><rect width="60" height="13" fill="#000"/><rect y="13" width="60" height="13" fill="#D00"/><rect y="26" width="60" height="13" fill="#FFCE00"/></svg></span>
              <span>Germany</span>
            </span>
            <span class="ping">16 ms</span>
          </button>

          <button class="loc-row" onclick="pickNode('United States', 'New York', '68 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#B22234"/><path d="M0,6H60 M0,15H60 M0,25H60 M0,34H60" stroke="#fff" stroke-width="4"/><rect width="26" height="22" fill="#3C3B6E"/></svg></span>
              <span>United States</span>
            </span>
            <span class="ping">68 ms</span>
          </button>

          <button class="loc-row" onclick="pickNode('Singapore', 'Singapore', '152 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 40"><rect width="60" height="20" fill="#EF3340"/><rect y="20" width="60" height="20" fill="#fff"/></svg></span>
              <span>Singapore</span>
            </span>
            <span class="ping">152 ms</span>
          </button>

          <button class="loc-row" onclick="pickNode('Japan', 'Tokyo', '142 ms', this)">
            <span class="loc-left">
              <span class="flag"><svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="11" fill="#BC002D"/></svg></span>
              <span>Japan</span>
            </span>
            <span class="ping">142 ms</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Right Panel: Calm Concentric Rings + Single Metadata Line + 1 Button -->
    <aside class="panel on" id="panel">
      <div class="rings"></div>
      <div class="panel-title" id="panelTitle">Connected to<br>stay private</div>
      <div class="panel-meta" id="panelMeta">London, UK &bull; 8 ms &bull; 4 Wi-Fi devices safe</div>
      <button class="connect-pill" id="connectBtn" onclick="toggleConnect()">Connected &#10003;</button>
    </aside>
  </div>

  <!-- Minimalist Unlock SWEEPR Pro Modal (3 Clean Plans + 1 Button; License Key Tucked Into Footer Link) -->
  <div class="backdrop" id="modal" onclick="openModal(false)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div>
          <div style="font-size:18px;font-weight:900">Unlock SWEEPR Pro</div>
          <div style="font-size:12px;color:var(--muted)">Up to 10 devices &middot; 14-day money-back guarantee</div>
        </div>
        <button onclick="openModal(false)" style="font-size:18px;color:var(--muted);padding:4px">✕</button>
      </div>

      <button class="plan on" onclick="pickPlan(this, 'Continue — £1.99 (1st Month)', '/order?plan=monthly&offer=intro')">
        <div>
          <div style="font-weight:800;font-size:14px">1st-Month Trial</div>
          <div style="font-size:12px;color:var(--muted)">£1.99 first month, then £12.49/mo</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900;font-size:16px;color:var(--accent)">£1.99</div>
          <div style="font-size:11px;color:var(--muted)">today</div>
        </div>
      </button>

      <button class="plan" onclick="pickPlan(this, 'Continue — £74.99/yr (Save 50%)', '/order?plan=annual')">
        <div>
          <div style="font-weight:800;font-size:14px">Yearly Plan &middot; <span style="color:var(--accent)">Save 50%</span></div>
          <div style="font-size:12px;color:var(--muted)">£74.99 billed once a year</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900;font-size:16px">£6.25</div>
          <div style="font-size:11px;color:var(--muted)">/month</div>
        </div>
      </button>

      <button class="plan" onclick="pickPlan(this, 'Continue — £48.99/6mo (Save 35%)', '/order?plan=sixmonth')">
        <div>
          <div style="font-weight:800;font-size:14px">6-Month Plan &middot; Save 35%</div>
          <div style="font-size:12px;color:var(--muted)">£48.99 every 6 months</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900;font-size:16px">£8.17</div>
          <div style="font-size:11px;color:var(--muted)">/month</div>
        </div>
      </button>

      <button class="btn-go" id="checkoutBtn" onclick="window.location.href=selectedUrl">Continue — £1.99 (1st Month)</button>

      <!-- Quiet Collapsible License Key Link Instead of Always-Visible Input Box Clutter -->
      <div style="text-align:center;margin-top:2px">
        <button onclick="document.getElementById('keyBox').style.display='flex'" style="font-size:12px;color:var(--muted);font-weight:600">Already have a license key? Enter it &rsaquo;</button>
        <div id="keyBox" style="display:none;gap:6px;margin-top:8px">
          <input placeholder="SWEEPR-VPN-XXXX" style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px" />
          <button onclick="openModal(false)" style="background:var(--ink);color:#fff;border-radius:10px;padding:0 12px;font-size:12px;font-weight:700">Activate</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let connected = true;
    let currentCity = 'London, UK';
    let currentPing = '8 ms';
    let selectedUrl = '/order?plan=monthly&offer=intro';

    function pickNode(country, city, ping, row) {
      currentCity = `${city}, ${country === 'United Kingdom' ? 'UK' : country}`;
      currentPing = ping;
      document.querySelectorAll('.loc-row').forEach(r => r.classList.remove('on'));
      if (row) row.classList.add('on');
      updatePanel();
    }

    function toggleConnect() {
      connected = !connected;
      updatePanel();
    }

    function updatePanel() {
      const panel = document.getElementById('panel');
      const title = document.getElementById('panelTitle');
      const meta = document.getElementById('panelMeta');
      const btn = document.getElementById('connectBtn');
      if (connected) {
        panel.classList.add('on');
        title.innerHTML = 'Connected to<br>stay private';
        meta.innerHTML = `${currentCity} &bull; ${currentPing} &bull; 4 Wi-Fi devices safe`;
        btn.innerHTML = 'Connected &#10003;';
      } else {
        panel.classList.remove('on');
        title.innerHTML = 'Connect to<br>stay private';
        meta.innerHTML = `${currentCity} &bull; Ready to protect`;
        btn.textContent = 'Connect';
      }
    }

    function blockTv() {
      const bar = document.getElementById('tvBar');
      bar.className = 'tv-pill safe';
      bar.innerHTML = '<span>&#10003; Samsung TV tracking blocked</span><span style="font-size:12px;font-weight:800">Shield On</span>';
    }

    function openModal(open) {
      document.getElementById('modal').classList.toggle('open', open);
    }

    function pickPlan(el, label, url) {
      selectedUrl = url;
      document.querySelectorAll('.plan').forEach(p => p.classList.remove('on'));
      el.classList.add('on');
      document.getElementById('checkoutBtn').textContent = label;
    }
  </script>
</body>
</html>
