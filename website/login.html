<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal Sign In &amp; Account Login | SWEEPR VPN</title>
  <meta name="description" content="Sign in to your SWEEPR VPN Customer Portal with a one-time email code to manage your subscription, download installers, or update your billing details.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://sweeprvpn.com/login">
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="stylesheet" href="/tailwind.min.css?v=1">
  <link rel="icon" type="image/svg+xml" href="/logo-emerald.svg?v=5">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=5">
  <link rel="shortcut icon" href="/favicon.ico?v=5">
  <link rel="stylesheet" href="/style.css">
  <script src="/pricing-config.js?v=3" defer></script>
  <!-- Google tag (gtag.js) - Sweepr VPN -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7D28EEMNXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7D28EEMNXX');
  </script>
</head>
<body class="text-gray-800 flex flex-col items-center justify-center min-h-screen px-4 py-8">

  <div class="rack-telemetry-bar w-full max-w-md mb-3">
    <span class="rack-telemetry-segment"><span class="rack-led"></span>AUTH // PORTAL-OTP</span>
    <span class="rack-telemetry-segment">TLS 1.3 &middot; 6-DIGIT SINGLE-USE</span>
  </div>

  <div class="rack-card glass-card p-8 sm:p-10 w-full max-w-md relative">
    <a href="/" id="backBtn" class="absolute top-6 left-6 text-gray-400 hover:text-gray-800 transition-colors p-1" title="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </a>

    <!-- Language Selector Dropdown -->
    <div class="absolute top-5 right-5 z-20" id="langDropdownContainer">
      <button type="button" id="langDropdownBtn" class="btn btn-ghost text-xs flex items-center gap-1.5 px-2.5 py-1.5 cursor-pointer font-medium text-gray-700 hover:text-emerald-700 transition-colors" aria-expanded="false" aria-label="Select Language">
        <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 font-mono text-[10px] font-bold text-gray-700" id="currentLangFlag">GB</span>
        <span class="text-xs font-bold tracking-wide" id="currentLangCode">EN</span>
        <svg id="langDropdownChevron" class="w-3 h-3 text-gray-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div id="langDropdownMenu" class="hidden absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded-xl shadow-lg p-1.5 z-50 text-gray-800">
        <div class="space-y-0.5 text-xs">
          <button type="button" onclick="setLanguage('en')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-emerald-50 text-gray-800 hover:text-emerald-700 transition-colors font-medium cursor-pointer">
            <span class="flex items-center gap-2"><span class="px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 font-mono text-[10px] font-bold text-gray-700">GB</span> <span>English</span></span>
            <span class="text-[10px] text-gray-400 font-mono">EN</span>
          </button>
          <button type="button" onclick="setLanguage('de')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-emerald-50 text-gray-800 hover:text-emerald-700 transition-colors font-medium cursor-pointer">
            <span class="flex items-center gap-2"><span class="px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 font-mono text-[10px] font-bold text-gray-700">DE</span> <span>Deutsch</span></span>
            <span class="text-[10px] text-gray-400 font-mono">DE</span>
          </button>
          <button type="button" onclick="setLanguage('fr')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-emerald-50 text-gray-800 hover:text-emerald-700 transition-colors font-medium cursor-pointer">
            <span class="flex items-center gap-2"><span class="px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 font-mono text-[10px] font-bold text-gray-700">FR</span> <span>Français</span></span>
            <span class="text-[10px] text-gray-400 font-mono">FR</span>
          </button>
          <button type="button" onclick="setLanguage('es')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-emerald-50 text-gray-800 hover:text-emerald-700 transition-colors font-medium cursor-pointer">
            <span class="flex items-center gap-2"><span class="px-1.5 py-0.5 rounded bg-gray-100 border border-gray-200 font-mono text-[10px] font-bold text-gray-700">ES</span> <span>Español</span></span>
            <span class="text-[10px] text-gray-400 font-mono">ES</span>
          </button>
        </div>
      </div>
    </div>
    
    <div class="text-center mb-8 mt-4">
      <div class="logo-box mx-auto mb-4">S</div>
      <h1 class="text-2xl font-bold tracking-tight text-gray-900">Customer Portal Sign In</h1>
      <p class="text-gray-500 mt-2 text-sm" id="headerSubtitle">Manage your subscription, update payment methods, and download the app.</p>
    </div>

    <form id="loginForm" class="flex flex-col gap-4">
      <div id="emailSection">
        <label class="block text-sm font-semibold mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-500 transition-shadow bg-white">
        <div class="mt-2 flex items-center justify-end">
          <button type="button" id="haveCodeBtn" class="text-xs font-semibold text-green-600 hover:text-green-700 transition-colors">
            Already have a 6-digit code? Enter it here
          </button>
        </div>
      </div>
      
      <div id="otpSection" class="hidden">
        <div class="flex items-center justify-between mb-1">
          <label class="block text-sm font-semibold">Login Code</label>
          <button type="button" id="changeEmailBtn" class="text-xs text-green-600 hover:text-green-700 font-medium transition-colors">Change email</button>
        </div>
        <p class="text-xs text-gray-500 mb-2">
          Enter the 6-digit login code for <strong id="targetEmail" class="text-gray-800 font-semibold"></strong>.
        </p>
        <input type="hidden" id="otp" value="">
        <div id="otpSlotsGrid" class="grid grid-cols-6 gap-2 my-1" role="group" aria-label="6-digit login code">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" data-otp-idx="0" aria-label="Digit 1" class="otp-slot w-full h-12 text-center rounded-lg border border-gray-300 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 bg-white font-mono text-xl font-bold tabular-nums text-gray-900 transition-colors">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-idx="1" aria-label="Digit 2" class="otp-slot w-full h-12 text-center rounded-lg border border-gray-300 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 bg-white font-mono text-xl font-bold tabular-nums text-gray-900 transition-colors">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-idx="2" aria-label="Digit 3" class="otp-slot w-full h-12 text-center rounded-lg border border-gray-300 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 bg-white font-mono text-xl font-bold tabular-nums text-gray-900 transition-colors">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-idx="3" aria-label="Digit 4" class="otp-slot w-full h-12 text-center rounded-lg border border-gray-300 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 bg-white font-mono text-xl font-bold tabular-nums text-gray-900 transition-colors">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-idx="4" aria-label="Digit 5" class="otp-slot w-full h-12 text-center rounded-lg border border-gray-300 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 bg-white font-mono text-xl font-bold tabular-nums text-gray-900 transition-colors">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-idx="5" aria-label="Digit 6" class="otp-slot w-full h-12 text-center rounded-lg border border-gray-300 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/20 bg-white font-mono text-xl font-bold tabular-nums text-gray-900 transition-colors">
        </div>
        
        <div class="mt-2 flex items-center justify-center">
          <button type="button" id="resendOtpBtn" class="text-xs font-semibold text-emerald-700 hover:text-emerald-800 disabled:text-gray-400 disabled:cursor-not-allowed transition-colors py-1 px-2 rounded tabular-nums">
            Didn't receive it? Resend code
          </button>
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary btn-async-grid w-full justify-center" id="loginBtn">
        <span class="btn-state-idle"><span id="loginBtnText">Continue</span></span>
        <span class="btn-state-loading">
          <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          <span>Verifying…</span>
        </span>
      </button>
    </form>
    
    <div id="message" class="hidden mt-4 text-center text-sm font-medium p-3 rounded-lg border"></div>

    <div class="text-center mt-6 pt-5 border-t border-gray-100">
      <p class="text-xs text-gray-500 mb-2 font-medium">Don't have SWEEPR VPN yet?</p>
      <a href="/order" class="btn btn-go w-full justify-center gap-2 text-sm">
        <span>Buy Now</span>
        <svg class="arrow-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>
    </div>
  </div>

  <div class="mt-8 text-xs text-gray-500 flex flex-wrap justify-center gap-4">
    <a href="/refund" class="hover:text-gray-900 transition-colors">Refund Policy</a>
    <a href="/terms" class="hover:text-gray-900 transition-colors">Terms of Service</a>
    <a href="/privacy" class="hover:text-gray-900 transition-colors">Privacy Policy</a>
    <a href="/support" class="hover:text-gray-900 transition-colors">Support &amp; Help</a>
  </div>

  <script>
    let awaitingOtp = false;
    let cooldownTimer = null;
    let cooldownSeconds = 0;

    const backBtn = document.getElementById('backBtn');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const msg = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const emailSection = document.getElementById('emailSection');
    const otpSection = document.getElementById('otpSection');
    const otpInput = document.getElementById('otp');
    const targetEmail = document.getElementById('targetEmail');
    const changeEmailBtn = document.getElementById('changeEmailBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const haveCodeBtn = document.getElementById('haveCodeBtn');

    function showMessage(text, type) {
      if (!text) {
        msg.classList.add('hidden');
        return;
      }
      msg.textContent = text;
      msg.className = "mt-4 text-center text-sm font-medium p-3 rounded-lg border";
      if (type === 'success') {
        msg.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
      } else {
        msg.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      }
      msg.classList.remove('hidden');
    }

    function startCooldown(seconds = 30) {
      cooldownSeconds = seconds;
      resendOtpBtn.disabled = true;
      updateResendText();
      if (cooldownTimer) clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        cooldownSeconds--;
        if (cooldownSeconds <= 0) {
          clearInterval(cooldownTimer);
          cooldownTimer = null;
          resendOtpBtn.disabled = false;
          resendOtpBtn.textContent = "Didn't receive it? Resend code";
        } else {
          updateResendText();
        }
      }, 1000);
    }

    function updateResendText() {
      resendOtpBtn.textContent = `Resend code in ${cooldownSeconds}s`;
    }

    const otpSlots = Array.from(document.querySelectorAll('#otpSlotsGrid .otp-slot'));

    function syncOtpHiddenValue() {
      otpInput.value = otpSlots.map((el) => (el.value || '').replace(/[^0-9]/g, '').slice(0, 1)).join('');
    }

    function clearOtpSlots(focusFirst = false) {
      otpSlots.forEach((el) => { el.value = ''; });
      otpInput.value = '';
      if (focusFirst && otpSlots[0]) otpSlots[0].focus();
    }

    function fillOtpFromDigits(rawDigits) {
      const digits = String(rawDigits || '').replace(/[^0-9]/g, '').slice(0, 6);
      otpSlots.forEach((el, idx) => { el.value = digits[idx] || ''; });
      syncOtpHiddenValue();
      const targetIdx = Math.min(digits.length, otpSlots.length - 1);
      if (otpSlots[targetIdx]) otpSlots[targetIdx].focus();
    }

    otpSlots.forEach((slot, idx) => {
      slot.addEventListener('input', (e) => {
        const cleaned = (e.target.value || '').replace(/[^0-9]/g, '');
        if (cleaned.length > 1) {
          fillOtpFromDigits(cleaned);
          return;
        }
        e.target.value = cleaned.slice(0, 1);
        syncOtpHiddenValue();
        if (cleaned && idx < otpSlots.length - 1) {
          otpSlots[idx + 1].focus();
        }
      });
      slot.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !slot.value && idx > 0) {
          otpSlots[idx - 1].value = '';
          otpSlots[idx - 1].focus();
          syncOtpHiddenValue();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          otpSlots[idx - 1].focus();
          e.preventDefault();
        } else if (e.key === 'ArrowRight' && idx < otpSlots.length - 1) {
          otpSlots[idx + 1].focus();
          e.preventDefault();
        }
      });
      slot.addEventListener('paste', (e) => {
        const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
        const digits = text.replace(/[^0-9]/g, '').slice(0, 6);
        if (digits) {
          e.preventDefault();
          fillOtpFromDigits(digits);
        }
      });
    });

    (function initLangSelector() {
      const btn = document.getElementById('langDropdownBtn');
      const menu = document.getElementById('langDropdownMenu');
      const chev = document.getElementById('langDropdownChevron');
      if (btn && menu) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = menu.classList.toggle('hidden') === false;
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (chev) chev.style.transform = open ? 'rotate(180deg)' : '';
        });
        document.addEventListener('click', () => {
          if (!menu.classList.contains('hidden')) {
            menu.classList.add('hidden');
            btn.setAttribute('aria-expanded', 'false');
            if (chev) chev.style.transform = '';
          }
        });
      }
      window.setLanguage = function(lang) {
        const meta = { en: ['GB', 'EN'], de: ['DE', 'DE'], fr: ['FR', 'FR'], es: ['ES', 'ES'] }[lang] || ['GB', 'EN'];
        const f = document.getElementById('currentLangFlag');
        const c = document.getElementById('currentLangCode');
        if (f) f.textContent = meta[0];
        if (c) c.textContent = meta[1];
        if (menu) menu.classList.add('hidden');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        if (chev) chev.style.transform = '';
      };
    })();

    function setLoginLoading(loading) {
      loginBtn.disabled = !!loading;
      loginBtn.classList.toggle('is-loading', !!loading);
    }

    function showEmailStep() {
      awaitingOtp = false;
      emailSection.classList.remove('hidden');
      otpSection.classList.add('hidden');
      loginBtnText.textContent = "Continue";
      setLoginLoading(false);
      showMessage('', false);
      emailInput.focus();
    }

    function showOtpStep(email, withCooldown = true) {
      awaitingOtp = true;
      emailSection.classList.add('hidden');
      otpSection.classList.remove('hidden');
      targetEmail.textContent = email;
      loginBtnText.textContent = "Verify Code";
      setLoginLoading(false);
      clearOtpSlots(true);
      if (withCooldown) {
        startCooldown(30);
      } else {
        if (cooldownTimer) clearInterval(cooldownTimer);
        cooldownSeconds = 0;
        resendOtpBtn.disabled = false;
        resendOtpBtn.textContent = "Didn't receive it? Resend code";
      }
    }

    haveCodeBtn.addEventListener('click', () => {
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        showMessage("Please enter your email address first, then click 'Already have a 6-digit code?'.", 'error');
        emailInput.focus();
        return;
      }
      showMessage('', false);
      showOtpStep(email, false);
    });

    (function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const qEmail = params.get('email');
      if (qEmail) {
        emailInput.value = qEmail;
        if (params.get('step') === 'otp') {
          showOtpStep(qEmail, false);
        }
      }
    })();

    backBtn.addEventListener('click', (e) => {
      if (awaitingOtp) {
        e.preventDefault();
        showEmailStep();
      }
    });

    changeEmailBtn.addEventListener('click', () => {
      showEmailStep();
    });

    resendOtpBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email || cooldownSeconds > 0) return;
      
      resendOtpBtn.disabled = true;
      resendOtpBtn.textContent = "Sending new code...";
      showMessage('', false);

      try {
        const res = await fetch('/api/portal-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.otpSent) {
          startCooldown(30);
          showMessage('A fresh 6-digit login code has been sent! Please check your inbox and spam folder.', 'success');
          clearOtpSlots(true);
        } else {
          resendOtpBtn.disabled = false;
          resendOtpBtn.textContent = "Didn't receive it? Resend code";
          showMessage(data.error || 'Failed to resend code. Please try again.', 'error');
        }
      } catch {
        resendOtpBtn.disabled = false;
        resendOtpBtn.textContent = "Didn't receive it? Resend code";
        showMessage('Network error. Please try again.', 'error');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      
      setLoginLoading(true);
      showMessage('', false);

      try {
        if (!awaitingOtp) {
          const res = await fetch('/api/portal-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          
          const data = await res.json();
          if (data.otpSent) {
            showOtpStep(email);
          } else {
            showMessage(data.error || "No active subscription found for this email.", 'error');
            setLoginLoading(false);
            loginBtnText.textContent = "Continue";
          }
        } else {
          syncOtpHiddenValue();
          const code = otpInput.value.trim();
          if (code.length !== 6) {
            showMessage("Please enter the 6-digit login code.", 'error');
            setLoginLoading(false);
            loginBtnText.textContent = "Verify Code";
            return;
          }

          const res = await fetch('/api/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
          });
          const data = await res.json();
          if (data.redirect) {
            window.location.href = data.redirect;
          } else {
            showMessage(data.error || "Invalid or expired code.", 'error');
            setLoginLoading(false);
            loginBtnText.textContent = "Verify Code";
          }
        }
      } catch (err) {
        showMessage("Network error. Please try again.", 'error');
        setLoginLoading(false);
        loginBtnText.textContent = awaitingOtp ? "Verify Code" : "Continue";
      }
    });
  </script>
</body>
</html>
