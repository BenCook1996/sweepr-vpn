name: SweeprVPN
options:
  bundleIdPrefix: com.sweepr
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  WireGuardKit:
    url: https://git.zx2c4.com/wireguard-apple
    from: "1.0.16"
targets:
  SweeprVPN:
    type: application
    platform: [iOS, macOS]
    sources:
      - SweeprVpnApp.swift
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.vpn
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: SweeprVPN.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: SweeprVPN.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: SweeprVPNMac.entitlements
    entitlements:
      path: SweeprVPN.entitlements
    dependencies:
      - target: TunnelExtension
        embed: true
  TunnelExtension:
    type: app-extension
    platform: [iOS, macOS]
    sources:
      - TunnelExtension/PacketTunnelProvider.swift
      - TunnelExtension/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.vpn.tunnel
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: TunnelExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: TunnelExtension/TunnelExtension.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: TunnelExtension/TunnelExtension.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: TunnelExtension/TunnelExtensionMac.entitlements
    entitlements:
      path: TunnelExtension/TunnelExtension.entitlements
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
schemes:
  SweeprVPN:
    build:
      targets:
        SweeprVPN: all
    run:
      storeKitConfiguration: SweeprVPN.storekit
