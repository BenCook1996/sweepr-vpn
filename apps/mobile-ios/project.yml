name: SweeprVPN
options:
  bundleIdPrefix: com.sweepr
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  WireGuardKit:
    path: Vendor/wireguard-apple
targets:
  SweeprVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SweeprVpnApp.swift
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: SweeprVPN
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.vpn
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
    entitlements:
      path: SweeprVPN.entitlements
    dependencies:
      - target: TunnelExtension
        embed: true
  TunnelExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - TunnelExtension/PacketTunnelProvider.swift
      - TunnelExtension/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: TunnelExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.vpn.tunnel
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: TunnelExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/wg-libs/$(PLATFORM_NAME)"
    entitlements:
      path: TunnelExtension/TunnelExtension.entitlements
    dependencies:
      - package: WireGuardKit
  SweeprVPNMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - SweeprVpnApp.swift
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: SweeprVPN
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.vpn
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
    entitlements:
      path: SweeprVPNMac.entitlements
    dependencies:
      - target: TunnelExtensionMac
        embed: true
  TunnelExtensionMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - TunnelExtension/PacketTunnelProvider.swift
      - TunnelExtension/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: TunnelExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.vpn.tunnel
        MARKETING_VERSION: "2.6.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: TunnelExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/wg-libs/$(PLATFORM_NAME)"
    entitlements:
      path: TunnelExtension/TunnelExtensionMac.entitlements
    dependencies:
      - package: WireGuardKit
schemes:
  SweeprVPN:
    build:
      targets:
        SweeprVPN: all
    run:
      storeKitConfiguration: SweeprVPN.storekit
  SweeprVPNMac:
    build:
      targets:
        SweeprVPNMac: all
    run:
      storeKitConfiguration: SweeprVPN.storekit
