[package]
name = "sweepr-wifi-radar"
version = "0.1.0"
edition = "2021"
description = "SWEEPR Wi-Fi Radar: finds and names every device on the home network"

[lib]
name = "sweepr_wifi_radar"
path = "src/lib.rs"

[[bin]]
name = "sweepr-radar-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
dns-lookup = "2"
netdev = "0.31"
